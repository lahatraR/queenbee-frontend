name: CI

on:
  pull_request:
  push:
    branches: [develop, preprod, main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect project
        id: detect
        run: |
          if [ -f package.json ]; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "found=false" >> "$GITHUB_OUTPUT"; fi
      - name: Skip until the Angular project exists
        if: steps.detect.outputs.found == 'false'
        run: echo "::notice::No package.json yet (Trello QB-009). Build skipped."
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.found == 'true'
        with:
          node-version: "22"
          cache: npm
      - name: Install
        if: steps.detect.outputs.found == 'true'
        run: npm ci
      - name: Lint
        if: steps.detect.outputs.found == 'true'
        run: npm run lint --if-present
      - name: Test
        if: steps.detect.outputs.found == 'true'
        run: npm run test:ci --if-present
      - name: Build
        if: steps.detect.outputs.found == 'true'
        run: npm run build --if-present
